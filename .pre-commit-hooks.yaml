- id: mcp-warden
  name: mcp-warden (MCP config security audit)
  description: Blocks commits that add leaked secrets, unpinned servers or other risky MCP configuration.
  entry: mcp-warden scan --no-discover
  language: node
  pass_filenames: true
  files: (^|/)(\.mcp\.json|mcp\.json|mcp_config\.json|mcp_settings\.json|cline_mcp_settings\.json|claude_desktop_config\.json|\.claude\.json)$|(^|/)\.(vscode|cursor|gemini|roo|amazonq)/(mcp|settings)\.json$|(^|/)\.codex/config\.toml$
