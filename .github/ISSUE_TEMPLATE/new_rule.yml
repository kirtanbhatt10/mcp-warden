name: New rule / detection
description: Suggest a new check, token format, client, or a malicious/vulnerable MCP package
labels: [enhancement, rule]
body:
  - type: textarea
    id: risk
    attributes:
      label: What risk should be detected?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example config or tool definition
      render: json
  - type: input
    id: refs
    attributes:
      label: References (advisory, blog post, CVE)
